<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>밍밍 낚시</title>
<meta name="description" content="쭈꾸미·갑오징어 낚시 기록: 장비 가계부와 조과 카운터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eaf1f2; --panel:#fff; --ink:#10232c; --muted:#5b707a; --line:#d3dfe2;
  --sea:#0f6e74; --c1:#e2553b; --c2:#7a3b52; --c3:#2f8f86;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1a21; --panel:#132a33; --ink:#e6f0f2; --muted:#8fa6ae; --line:#24424d;
  --sea:#4fc1c4; --c1:#f06a4f; --c2:#c9789a; --c3:#3fb3a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a21; --panel:#132a33; --ink:#e6f0f2; --muted:#8fa6ae; --line:#24424d;
  --sea:#4fc1c4; --c1:#f06a4f; --c2:#c9789a; --c3:#3fb3a8; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 48px}
h1{font-family:var(--display);font-weight:400;font-size:40px;margin:0;letter-spacing:.5px}
.lede{margin:4px 0 22px;color:var(--muted)}
.grid{display:grid;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;border-top:6px solid var(--accent);transition:transform .12s ease}
a.card:hover{transform:translateY(-2px)}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card .ico{font-size:30px;line-height:1}
.card h2{margin:4px 0 0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:13px}
.card .stat{margin-top:auto;padding-top:8px;font-family:var(--display);font-size:24px;min-height:36px}
.card .stat small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:4px}
.card .go{font-size:13px;font-weight:700;color:var(--accent)}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
<script src="/menu.js"></script>
<script src="/jjugap/config.js"></script>
</head>
<body>
<main class="wrap">
  <h1>밍밍 낚시</h1>
  <p class="lede">쭈꾸미·갑오징어 낚시 기록장. 장비에 쓴 돈과 배 위에서 잡은 조과를 한곳에서 봐요.</p>
  <div class="grid">
    <a class="card" href="/jjugap/" style="--accent:var(--sea)">
      <span class="ico" aria-hidden="true">📒</span>
      <h2>쭈갑 가계부</h2>
      <p>장비·소모품·선비 지출과 장바구니</p>
      <span class="stat num" id="ledgerStat">&nbsp;</span>
      <span class="go">열기 →</span>
    </a>
    <a class="card" href="/jjugap/counter/" style="--accent:var(--c1)">
      <span class="ico" aria-hidden="true">🦑</span>
      <h2>방울 쭈갑 카운터</h2>
      <p>배 위에서 한 손으로 조과 세기</p>
      <span class="stat num" id="counterStat">&nbsp;</span>
      <span class="go">열기 →</span>
    </a>
    <a class="card" href="/youngman/" style="--accent:var(--c2)">
      <span class="ico" aria-hidden="true">🐙</span>
      <h2>영맨 쭈갑 카운터</h2>
      <p>영맨의 조과 카운터. 신호 끊겨도 기록돼요</p>
      <span class="stat num" id="ymStat">&nbsp;</span>
      <span class="go">열기 →</span>
    </a>
  </div>
  <p class="foot">가계부와 두 카운터는 링크가 있는 누구나 보고 고칠 수 있어요.</p>
</main>
<script>
(function(){
  var API=(window.JJUGAP_CONFIG||{}).api; if(!API) return;
  var won=function(n){return (Number(n)||0).toLocaleString('ko-KR')};
  fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(res){
    var o=(res.data&&res.data.orders)||[]; var s=o.reduce(function(a,x){return a+(+x.total||0)},0);
    if(o.length) document.getElementById('ledgerStat').innerHTML=won(s)+'<small>원 지출</small>';
  }).catch(function(){});
  fetch(API+'?store=trips',{cache:'no-store'}).then(function(r){return r.json()}).then(function(res){
    var t=res.trips||[]; var s=t.reduce(function(a,x){return a+(+x.total||0)},0);
    if(t.length) document.getElementById('counterStat').innerHTML=t.length+'<small>회 출조</small> '+s+'<small>수</small>';
  }).catch(function(){});
  fetch(API+'?store=ym',{cache:'no-store'}).then(function(r){return r.json()}).then(function(res){
    var t=(res.ym&&res.ym.trips)||[]; var s=t.reduce(function(a,x){return a+(+x.total||0)},0);
    if(t.length) document.getElementById('ymStat').innerHTML=t.length+'<small>회 출조</small> '+s+'<small>수</small>';
  }).catch(function(){});
})();
</script>
</body>
</html>
